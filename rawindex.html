<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlotte County Business Directory</title>
  <!-- Sophisticated Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Navy & Gold Sophisticated Businesslike Theme */
    :root {
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --navy-primary: #0F172A;
      --navy-hover: #1E293B;
      --gold-accent: #D97706;
      --gold-hover: #B45309;
      --text-dark: #0F172A;
      --text-muted: #475569;
      --border-color: #E2E8F0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      background-color: var(--navy-primary);
      color: #FFFFFF;
      padding: 2.5rem 1rem;
      text-align: center;
      border-bottom: 4px solid var(--gold-accent);
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      color: #FFFFFF;
      margin: 0 0 0.5rem 0;
      font-size: 2.5rem;
    }

    header p {
      color: #CBD5E1;
      margin: 0 0 1.5rem 0;
      font-size: 1.1rem;
    }

    .top-actions {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      font-family: 'Inter', sans-serif;
      background-color: var(--gold-accent);
      color: #FFFFFF;
      border: none;
      padding: 0.65rem 1.35rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: var(--gold-hover);
    }

    .btn-secondary {
      background-color: var(--navy-primary);
      border: 1px solid var(--gold-accent);
    }

    .btn-secondary:hover {
      background-color: var(--navy-hover);
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .controls-panel {
      background: var(--card-bg);
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 2rem;
    }

    .search-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .search-row input[type="text"], .search-row select {
      flex: 1;
      min-width: 220px;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      font-size: 1rem;
      color: var(--text-dark);
      background-color: #FFFFFF;
    }

    .search-row input[type="text"]:focus, .search-row select:focus {
      outline: 2px solid var(--gold-accent);
      border-color: transparent;
    }

    .tool-buttons {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
    }

    .tool-buttons button {
      background-color: var(--navy-primary);
      color: #FFFFFF;
      border: none;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
    }

    .tool-buttons button:hover {
      background-color: var(--navy-hover);
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }

    .card h3 {
      font-family: 'Playfair Display', serif;
      margin: 0;
      color: var(--navy-primary);
      font-size: 1.4rem;
    }

    .logo-img {
      max-width: 70px;
      max-height: 70px;
      object-fit: contain;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }

    .card-category {
      display: inline-block;
      background-color: #FEF3C7;
      color: #92400E;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.25rem 0.65rem;
      border-radius: 12px;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .slogan {
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .card-body {
      font-size: 0.95rem;
      color: var(--text-dark);
      margin-bottom: 1rem;
    }

    .contact-info, .location-info {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px dashed var(--border-color);
    }

    .contact-info p, .location-info p {
      margin: 0.25rem 0;
    }

    a {
      color: var(--gold-accent);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
      color: var(--gold-hover);
    }

    .card-footer {
      margin-top: 1rem;
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .share-btn {
      font-size: 0.8rem;
      padding: 0.35rem 0.65rem;
      background: var(--bg-color);
      color: var(--navy-primary);
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
    }

    .share-btn:hover {
      background: var(--border-color);
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 3rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .loading, .no-results {
      text-align: center;
      padding: 3rem;
      grid-column: 1 / -1;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    @media print {
      header, .controls-panel, .card-footer, footer, .top-actions {
        display: none !important;
      }
      body { background: #FFFFFF; }
      .directory-grid { display: block; }
      .card { page-break-inside: avoid; margin-bottom: 1.5rem; border: 1px solid #000000; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Charlotte County Business Directory</h1>
    <p>Connecting Local Entrepreneurs with the Community</p>
    <div class="top-actions">
      <a href="form.html" class="btn">+ Add Your Business Listing</a>
    </div>
  </header>

  <div class="container">
    <div class="controls-panel">
      <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search by name, keyword, or location..." onkeyup="filterDirectory()">
        <select id="categorySelect" onchange="filterDirectory()">
          <option value="">All Categories</option>
          <option value="Home & Garden Services">Home & Garden Services</option>
          <option value="Local Trades & Repairs">Local Trades & Repairs</option>
          <option value="Food & Drinks">Food & Drinks</option>
          <option value="Shops & Retail">Shops & Retail</option>
          <option value="Salons, Beauty & Fitness">Salons, Beauty & Fitness</option>
          <option value="Professional & Online Services">Professional & Online Services</option>
        </select>
      </div>

      <div class="tool-buttons">
        <span>Tools:</span>
        <button onclick="window.print()">Print Directory</button>
        <button onclick="downloadCSV()">Download CSV</button>
      </div>
    </div>

    <div id="directoryGrid" class="directory-grid">
      <div class="loading">Loading business listings...</div>
    </div>
  </div>

  <footer>
    <p>Need assistance or have questions? Contact support: <a href="mailto:DIYSEO.support@gmail.com">DIYSEO.support@gmail.com</a></p>
  </footer>

  <script>
   const CSV_URL = 'https://google.com';
const DIRECTORY_URL = 'https://github.io';
    let allBusinesses = [];

    function loadDirectory() {
      const script = document.createElement('script');
      script.src = `${CSV_URL}?callback=handleDirectoryData`;
      document.body.appendChild(script);
    }

    function handleDirectoryData(csvData, error) {
      if (error) {
        document.getElementById('directoryGrid').innerHTML = `<div class="no-results">Error loading listings: ${error}</div>`;
        return;
      }
      parseCSV(csvData);
      renderDirectory(allBusinesses);
    }

    function parseCSV(text) {
      const lines = text.split('\n').filter(line => line.trim() !== '');
      if (lines.length <= 1) {
        allBusinesses = [];
        return;
      }

      allBusinesses = [];
      for (let i = 1; i < lines.length; i++) {
        const row = parseCSVLine(lines[i]);
        if (row.length < 1) continue;

        allBusinesses.push({
          name: row || '',
          category: row[1] || '',
          contactName: row[2] || '',
          contactTitle: row[3] || '',
          about: row[4] || '',
          details: row[5] || '',
          slogan: row[6] || '',
          phone: row[7] || '',
          website: row[8] || '',
          email: row[9] || '',
          facebook: row[10] || '',
          ndBiz: row[11] || '',
          ndPersonal: row[12] || '',
          address: row[13] || '',
          area: row[14] || '',
          logo: row[15] || ''
        });
      }
    }

    function parseCSVLine(text) {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          if (inQuotes && text[i + 1] === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          result.push(cell);
          cell = '';
        } else {
          cell += c;
        }
      }
      result.push(cell);
      return result;
    }

    function renderDirectory(businesses) {
      const container = document.getElementById('directoryGrid');
      if (!businesses || businesses.length === 0) {
        container.innerHTML = '<div class="no-results">No business listings found. Be the first to list yours!</div>';
        return;
      }

      container.innerHTML = businesses.map(b => `
        <div class="card">
          <div>
            <div class="card-header">
              <div>
                <h3>${escapeHtml(b.name)}</h3>
                ${b.contactName ? `<div style="font-size:0.9rem; color:var(--text-muted);">\\({escapeHtml(b.contactName)}\\){b.contactTitle ? ` - ${escapeHtml(b.contactTitle)}` : ''}</div>` : ''}
              </div>
              ${b.logo ? `<img src="\\({escapeHtml(b.logo)}" alt="\\){escapeHtml(b.name)} Logo" class="logo-img">` : ''}
            </div>

            ${b.category ? `<span class="card-category">\${escapeHtml(b.category)}</span>` : ''}
            ${b.slogan ? `<div class="slogan">"\${escapeHtml(b.slogan)}"</div>` : ''}
            ${b.about ? `<div class="card-body">\${escapeHtml(b.about)}</div>` : ''}

            <div class="contact-info">
              ${b.phone ? `<p>📞 <strong>Phone:</strong> <a href="tel:\\({escapeHtml(b.phone)}">\\){escapeHtml(b.phone)}</a></p>` : ''}
              ${b.email ? `<p>✉️ <strong>Email:</strong> <a href="mailto:\\({escapeHtml(b.email)}">\\){escapeHtml(b.email)}</a></p>` : ''}
              ${b.website ? `<p>🌐 <strong>Website:</strong> <a href="\\({formatUrl(b.website)}" target="_blank" rel="noopener">\\){escapeHtml(b.website)}</a></p>` : ''}
              ${b.facebook ? `<p>📘 <strong>Facebook:</strong> <a href="\${formatUrl(b.facebook)}" target="_blank" rel="noopener">View Page</a></p>` : ''}
              ${b.ndBiz ? `<p>🏡 <strong>NextDoor:</strong> <a href="\${formatUrl(b.ndBiz)}" target="_blank" rel="noopener">View Page</a></p>` : ''}
            </div>

            ${(b.address || b.area) ? `
              <div class="location-info">
                \${b.address ? `<p>📍 <strong>Address:</strong> ${escapeHtml(b.address)}</p>` : ''}
                \${b.area ? `<p>🚗 <strong>Area Served:</strong> ${escapeHtml(b.area)}</p>` : ''}
              </div>
            ` : ''}
          </div>

          <div class="card-footer">
            <button class="share-btn" onclick="shareBusiness('${escapeJs(b.name)}', '${escapeJs(b.phone)}', '${escapeJs(b.website)}')">Share Listing</button>
          </div>
        </div>
      `).join('');
    }

    function filterDirectory() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cat = document.getElementById('categorySelect').value.toLowerCase();

      const filtered = allBusinesses.filter(b => {
        const matchesSearch = !q || [b.name, b.about, b.slogan, b.address, b.area, b.contactName].some(f => (f || '').toLowerCase().includes(q));
        const matchesCat = !cat || (b.category || '').toLowerCase().includes(cat);
        return matchesSearch && matchesCat;
      });

      renderDirectory(filtered);
    }

    function escapeHtml(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      return String(str || '').replace(/'/g, "\\'");
    }

    function formatUrl(url) {
      if (!url) return '#';
      return /^https?:\/\//i.test(url) ? url : `https://${url}`;
    }

    function shareBusiness(name, phone, website) {
      const text = `Check out ${name} on the Charlotte County Business Directory: ${DIRECTORY_URL}`;
      if (navigator.share) {
        navigator.share({ title: name, text: text, url: DIRECTORY_URL });
      } else {
        navigator.clipboard.writeText(text);
        alert('Listing link copied to clipboard!');
      }
    }

    function downloadCSV() {
      let csv = 'Business Name,Category,Public Contact Name,Public Contact Title,About,Phone,Website,Email,Address,Area Served\n';
      allBusinesses.forEach(b => {
        csv += `"${b.name}","${b.category}","${b.contactName}","${b.contactTitle}","${b.about}","${b.phone}","${b.website}","${b.email}","${b.address}","${b.area}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'charlotte_county_directory.csv';
      a.click();
    }

    window.onload = loadDirectory;
  </script>
</body>
</html>
