<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Intake Form</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f0f0f0; margin: 20px; }
        .form-container { background-color: white; border: 3px solid #000; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; }
        .step { display: none; }
        .step.active { display: block; }
        input, select, textarea { width: 100%; padding: 8px; margin: 10px 0; box-sizing: border-box; border: 2px solid #000; }
        button { background-color: #5B2A86; color: white; padding: 10px 20px; border: 2px solid #000; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #7d3ca6; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
    </style>
</head>
<body>

<div class="form-container">
    <form id="directoryForm">
        <!-- STEP 1 -->
        <div class="step active" id="step1">
            <h2>Step 1: Business Identity</h2>
            <label>Business Name:</label>
            <input type="text" name="businessName" required>
            <label>Category:</label>
            <select name="category" required>
                <option value="">-- Select a Category --</option>
                <option value="Home & Garden Services">Home & Garden Services</option>
                <option value="Local Trades & Repairs">Local Trades & Repairs</option>
                <option value="Food & Drinks">Food & Drinks</option>
                <option value="Shops & Retail">Shops & Retail</option>
                <option value="Salons, Beauty & Fitness">Salons, Beauty & Fitness</option>
                <option value="Professional & Online Services">Professional & Online Services</option>
            </select>
            <label>Slogan or short description:</label>
            <input type="text" name="slogan">
        </div>

        <!-- STEP 2 -->
        <div class="step" id="step2">
            <h2>Step 2: Contact Info</h2>
            <label>Public Contact Name:</label>
            <input type="text" name="contactName" required>
            <label>Public Contact Title (e.g. Owner, Manager):</label>
            <input type="text" name="contactTitle">
            <label>Business Phone:</label>
            <input type="tel" name="phone">
            <label>Business Email:</label>
            <input type="email" name="email">
            <label>Business Website:</label>
            <input type="url" name="website">
        </div>

        <!-- STEP 3 -->
        <div class="step" id="step3">
            <h2>Step 3: Social Media & Location</h2>
            <label>Facebook Business Page:</label>
            <input type="text" name="facebook">
            <label>NextDoor Business Page:</label>
            <input type="text" name="nextdoor">
            <label>Street/City/State/Zip Address:</label>
            <input type="text" name="address">
            <label>Area Served (For Mobile/Online Services):</label>
            <input type="text" name="areaServed">
        </div>

        <!-- STEP 4 -->
        <div class="step" id="step4">
            <h2>Step 4: About & Details</h2>
            <label>Describe your business (Max 400 characters):</label>
            <textarea name="about" maxlength="400" rows="4"></textarea>
            <label>Other details (If applicable):</label>
            <textarea name="details" rows="2"></textarea>
            <label>Logo Drive Link:</label>
            <input type="url" name="logoUrl">
        </div>

        <!-- STEP 5 -->
        <div class="step" id="step5">
            <h2>Step 5: Review & Submit</h2>
            <p>Please confirm all your fields are correct before clicking submit.</p>
            <input type="hidden" name="ownerKey" value="">
            <input type="hidden" name="userEmail" value="">
        </div>

        <div class="nav-buttons">
            <button type="button" id="prevBtn" onclick="nextPrev(-1)" style="display:none;">Back</button>
            <button type="button" id="nextBtn" onclick="nextPrev(1)">Next</button>
        </div>
    </form>
</div>

<script>
    var ENDPOINT='https://google.com';
    
    var currentStep = 0;
    showStep(currentStep);

    function showStep(n) {
        var steps = document.getElementsByClassName("step");
        steps[n].className += " active";
        if (n == 0) {
            document.getElementById("prevBtn").style.display = "none";
        } else {
            document.getElementById("prevBtn").style.display = "inline";
        }
        if (n == (steps.length - 1)) {
            document.getElementById("nextBtn").innerHTML = "Submit";
        } else {
            document.getElementById("nextBtn").innerHTML = "Next";
        }
    }

    function nextPrev(n) {
        var steps = document.getElementsByClassName("step");
        if (n == 1 && !validateForm()) return false;
        steps[currentStep].className = steps[currentStep].className.replace(" active", "");
        currentStep = currentStep + n;
        if (currentStep >= steps.length) {
            submitData();
            return false;
        }
        showStep(currentStep);
    }

    function validateForm() {
        var steps = document.getElementsByClassName("step");
        var inputs = steps[currentStep].getElementsByTagName("input");
        var selects = steps[currentStep].getElementsByTagName("select");
        for (var i = 0; i < inputs.length; i++) {
            if (inputs[i].hasAttribute('required') && inputs[i].value == "") {
                inputs[i].style.borderColor = "red";
                return false;
            }
        }
        for (var i = 0; i < selects.length; i++) {
            if (selects[i].hasAttribute('required') && selects[i].value == "") {
                selects[i].style.borderColor = "red";
                return false;
            }
        }
        return true;
    }

    function submitData() {
        document.getElementById("nextBtn").disabled = true;
        document.getElementById("nextBtn").innerHTML = "Sending...";
        
        var form = document.getElementById("directoryForm");
        var formData = new FormData(form);
        
        var object = {};
        formData.forEach(function(value, key){
            object[key] = value;
        });

        var queryString = Object.keys(object).map(key => key + '=' + encodeURIComponent(object[key])).join('&');

        fetch(ENDPOINT + '?' + queryString, {
            method: 'POST',
            mode: 'no-cors'
        })
        .then(function() {
            alert("You're in! Check the directory in a minute.");
            window.location.reload();
        })
        .catch(function(error) {
            alert("Error sending data. Please try again.");
            document.getElementById("nextBtn").disabled = false;
            document.getElementById("nextBtn").innerHTML = "Submit";
        });
    }
</script>
</body>
</html>
