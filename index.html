<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charlotte County Small Business Directory</title>
    <style>
        body { font-family: 'Comic Sans MS', sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        header { text-align: center; padding: 30px 10px; background-color: #5B2A86; color: white; border: 3px solid #000; border-radius: 10px; margin-bottom: 30px; }
        header h1 { margin: 0 0 10px 0; font-size: 2.5rem; }
        header p { margin: 0; font-size: 1.2rem; }
        .action-bar { display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto 20px auto; flex-wrap: wrap; gap: 15px; }
        .add-btn { background-color: #ffd700; color: #000; font-weight: bold; text-decoration: none; padding: 12px 24px; border: 3px solid #000; border-radius: 5px; box-shadow: 4px 4px 0px #000; font-size: 1.1rem; }
        .add-btn:hover { background-color: #ffea70; transform: translateY(-2px); }
        .filter-container { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { background-color: white; border: 2px solid #000; padding: 8px 16px; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .filter-btn.active { background-color: #5B2A86; color: white; }
        .directory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto; }
        .biz-card { background: white; border: 3px solid #000; border-radius: 10px; padding: 20px; box-shadow: 5px 5px 0px #000; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
        .biz-category { font-size: 0.85rem; color: #666; font-weight: bold; text-transform: uppercase; margin-bottom: 5px; }
        .biz-name { font-size: 1.6rem; color: #5B2A86; font-weight: bold; margin: 0 0 10px 0; border-bottom: 2px dashed #000; padding-bottom: 5px; }
        .biz-slogan { font-style: italic; margin-bottom: 15px; color: #555; }
        .biz-details { font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px; }
        .contact-box { background-color: #CFE2F3; border: 2px solid #000; padding: 10px; border-radius: 5px; font-size: 0.9rem; }
        .contact-box p { margin: 4px 0; }
        .contact-box a { color: #5B2A86; font-weight: bold; }
        .logo-img { max-width: 80px; max-height: 80px; object-fit: contain; position: absolute; top: 15px; right: 15px; border: 1px solid #ccc; border-radius: 5px; background: white; }
        .footer-tools { max-width: 1200px; margin: 40px auto 0 auto; border-top: 2px solid #000; padding-top: 20px; display: flex; gap: 15px; justify-content: center; }
        .tool-link { color: #5B2A86; text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        .status-msg { text-align: center; font-size: 1.2rem; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

<header>
    <h1>Charlotte County Business Directory</h1>
    <p>Connecting Local Entrepreneurs with the Community</p>
</header>

<div class="action-bar">
    <a href="form.html" class="add-btn">+ Add Your Business Listing</a>
    <div class="filter-container" id="filterContainer">
        <button class="filter-btn active" onclick="filterCategory('All')">All Categories</button>
        <button class="filter-btn" onclick="filterCategory('Home & Garden Services')">Home & Garden Services</button>
        <button class="filter-btn" onclick="filterCategory('Local Trades & Repairs')">Local Trades & Repairs</button>
        <button class="filter-btn" onclick="filterCategory('Food & Drinks')">Food & Drinks</button>
        <button class="filter-btn" onclick="filterCategory('Shops & Retail')">Shops & Retail</button>
        <button class="filter-btn" onclick="filterCategory('Salons, Beauty & Fitness')">Salons, Beauty & Fitness</button>
        <button class="filter-btn" onclick="filterCategory('Professional & Online Services')">Professional & Online Services</button>
    </div>
</div>

<div class="status-msg" id="statusMessage">Loading business listings...</div>
<div class="directory-grid" id="directoryGrid"></div>

<div class="footer-tools">
    <a href="#" class="tool-link" onclick="window.print(); return false;">Print Directory</a>
    <span class="tool-link">|</span>
    <span id="supportEmail" class="tool-link">Support: DIYSEO.support@gmail.com</span>
</div>

<script>
    const CSV_URL = 'https://google.com';
    const DIRECTORY_URL = 'https://github.io';
    
    let allListings = [];

    window.onload = function() {
        fetchListings();
    };

    function fetchListings() {
        fetch(CSV_URL)
        .then(response => response.text())
        .then(text => {
            parseCSV(text);
        })
        .catch(error => {
            console.error('Error loading listings:', error);
            document.getElementById('statusMessage').innerText = 'Failed to load business entries.';
        });
    }

    function parseCSV(text) {
        let lines = [];
        let row = [""];
        let inQuotes = false;

        for (let i = 0; i < text.length; i++) {
            let c = text[i];
            let next = text[i+1];
            if (c === '"') {
                if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                else { inQuotes = !inQuotes; }
            } else if (c === ',' && !inQuotes) {
                row.push('');
            } else if ((c \(=== '\r' \vert{}\vert{}\) c === '\n') && !inQuotes) {
                if (c \(=== '\r' &&\) next === '\n') { i++; }
                lines.push(row);
                row = [''];
            } else {
                row[row.length - 1] += c;
            }
        }
        if (row.length > 1 || row[0] !== '') { lines.push(row); }
        if (lines.length === 0) return;

        const headers = lines[0];
        allListings = [];

        for (let i = 1; i < lines.length; i++) {
            const currentLine = lines[i];
            if (currentLine.length < headers.length) continue;
            
            let obj = {};
            for (let j = 0; j < headers.length; j++) {
                obj[headers[j].trim()] = currentLine[j] ? currentLine[j].trim() : '';
            }
            if (obj["Business Name"]) {
                allListings.push(obj);
            }
        }

        document.getElementById('statusMessage').style.display = 'none';
        renderCards(allListings);
    }

    function renderCards(listings) {
        const grid = document.getElementById('directoryGrid');
        grid.innerHTML = '';
        
        if (listings.length === 0) {
            grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; font-weight: bold;">No active listings found in this category.</p>';
            return;
        }

        listings.forEach(biz => {
            const card = document.createElement('div');
            card.className = 'biz-card';
            
            let contactInfoHtml = '';
            if (biz["Public Contact Name"]) contactInfoHtml += `<p><strong>Contact:</strong> ${biz["Public Contact Name"]}${biz["Public Contact Title"] ? ', ' + biz["Public Contact Title"] : ''}</p>`;
            if (biz["Phone"]) contactInfoHtml += `<p><strong>Phone:</strong> ${biz["Phone"]}</p>`;
            if (biz["Email"]) contactInfoHtml += `<p><strong>Email:</strong> <a href="mailto:${biz["Email"]}">${biz["Email"]}</a></p>`;
            if (biz["Website"]) contactInfoHtml += `<p><strong>Web:</strong> <a href="${biz["Website"]}" target="_blank">Visit Site</a></p>`;
            if (biz["Facebook"]) contactInfoHtml += `<p><strong>FB:</strong> <a href="${biz["Facebook"]}" target="_blank">Page</a></p>`;
            if (biz["NextDoor Business"]) contactInfoHtml += `<p><strong>NextDoor:</strong> <a href="${biz["NextDoor Business"]}" target="_blank">Page</a></p>`;

            let logoHtml = biz["Logo"] ? `<img src="${biz["Logo"]}" class="logo-img" alt="Logo">` : '';

            card.innerHTML = `
                <div>
                    ${logoHtml}
                    <div class="biz-category">${biz["Category"] || 'General'}</div>
                    <h3 class="biz-name">${biz["Business Name"]}</h3>
                    ${biz["Slogan"] ? `<div class="biz-slogan">"\${biz["Slogan"]}"</div>` : ''}
                    <div class="biz-details">
                        ${biz["About your business"] ? `<p>\${biz["About your business"]}</p>` : ''}
                        ${biz["Address"] ? `<p><strong>Location:</strong> \${biz["Address"]}</p>` : ''}
                        ${biz["Area Served"] ? `<p><strong>Area Served:</strong> \${biz["Area Served"]}</p>` : ''}
                    </div>
                </div>
                <div class="contact-box">
                    ${contactInfoHtml || '<p>No public contact contact details provided.</p>'}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    function filterCategory(categoryName) {
        const buttons = document.querySelectorAll('.filter-btn');
        buttons.forEach(btn => {
            if (btn.innerText === categoryName || (categoryName === 'All' && btn.innerText === 'All Categories')) {
                btn.className = 'filter-btn active';
            } else {
                btn.className = 'filter-btn';
            }
        });

        if (categoryName === 'All') {
            renderCards(allListings);
        } else {
            const filtered = allListings.filter(biz => biz["Category"] === categoryName);
            renderCards(filtered);
        }
    }
</script>
</body>
</html>
