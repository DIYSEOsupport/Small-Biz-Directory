<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2a86">
<title>Charlotte County Business Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Oswald:wght@400;500;600&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{
  --ink:#1a1033;--purple:#5b2a86;--magenta:#c2307a;--orange:#ff7a1a;--yellow:#ffd23f;
  --teal:#1fb5c9;--blue:#12407a;--green:#1f8a4c;--red:#e5322d;--cream:#fff6dc;
  --primary:var(--orange);--primary-light:#b34700;--glow:rgba(255,122,26,.4);
  --muted:#5b4a73;--border:var(--ink);--line:var(--ink);--cyan:var(--blue);
  --shadow:4px 4px 0 var(--ink);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);min-height:100vh;line-height:1.5;padding-bottom:env(safe-area-inset-bottom);
  background:linear-gradient(180deg,#3b1d6e 0%,#7b2d8e 18%,#c2307a 38%,#ff7a1a 62%,#ffd23f 78%,#1fb5c9 100%) fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.18;background:radial-gradient(var(--ink) 1.2px,transparent 1.6px) 0 0/9px 9px}
button,input,select{font-family:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 14px;position:relative;z-index:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* hero */
.hero{padding:calc(16px + env(safe-area-inset-top)) 14px 10px}
.hero-img{display:block;width:100%;height:auto;border:4px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);background:var(--purple)}
.tagline{display:block;width:fit-content;max-width:100%;margin:-14px auto 0;position:relative;font-family:'Bangers',cursive;letter-spacing:1.5px;font-size:clamp(18px,4.6vw,26px);background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:4px 18px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg);text-align:center}

/* sticky controls */
.controls{position:sticky;top:0;z-index:20;background:var(--cream);border-bottom:4px solid var(--ink);padding:10px 0 8px;padding-top:calc(10px + env(safe-area-inset-top));margin-top:18px}
.row{display:flex;gap:8px;align-items:center}
.search{position:relative;flex:1}
.search>svg{pointer-events:none;position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--magenta)}
.search input{width:100%;height:50px;padding:0 44px;font-size:16px;font-weight:600;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);outline:none;box-shadow:var(--shadow);transition:.15s}
.search input:focus{border-color:var(--magenta);box-shadow:4px 4px 0 var(--magenta)}
.search input::placeholder{color:#8a7aa3}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;display:none}
.clear.show{display:block}
.icon-btn{height:50px;min-width:50px;border-radius:14px;border:3px solid var(--ink);background:var(--teal);color:var(--ink);font-size:17px;cursor:pointer;position:relative;box-shadow:var(--shadow);transition:.1s}
.icon-btn:active,.icon-btn.on{background:var(--yellow);transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.icon-btn .dot{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid var(--ink);display:none}
.icon-btn .dot.show{display:block}

.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:50px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.pill:hover{background:#ffe9b8}
.pill.active{background:var(--orange);color:#fff;text-shadow:1px 1px 0 var(--ink);transform:translate(1px,1px) rotate(-1deg)}
.pill .n{opacity:.7;font-weight:700}

.panel{display:none;gap:8px;flex-wrap:wrap;padding:12px 4px 4px}
.panel.open{display:flex}
.sel{flex:1;min-width:140px;height:44px;padding:0 12px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:14px;font-weight:700}
.chipset{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.chip{height:38px;padding:0 14px;border-radius:12px;border:3px solid var(--ink);background:#fff;color:var(--ink);font-size:13px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.chip.active{background:var(--teal)}
.chip.fav.active{background:var(--magenta);color:#fff}

.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:#fff;font-weight:800;padding:14px 2px 12px;text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.status button{background:var(--yellow);border:3px solid var(--ink);border-radius:50px;color:var(--ink);font-weight:800;font-size:12px;cursor:pointer;padding:6px 14px;text-shadow:none;box-shadow:2px 2px 0 var(--ink)}
.status button:active{transform:translate(2px,2px);box-shadow:none}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding:4px 4px 100px}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;cursor:pointer;box-shadow:6px 6px 0 var(--ink);transition:transform .15s,box-shadow .15s;animation:in .25s ease both}
.card::before{content:'';position:absolute;inset:0 0 auto 0;height:10px;background:linear-gradient(90deg,var(--purple),var(--magenta),var(--orange),var(--yellow))}
.card .head{margin-top:6px}
.card:hover{transform:translate(-2px,-2px) rotate(-.4deg);box-shadow:9px 9px 0 var(--ink)}
.card:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.head{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Bangers',cursive;font-size:25px;color:#fff;background:var(--magenta);border:3px solid var(--ink);text-shadow:2px 2px 0 var(--ink);box-shadow:2px 2px 0 var(--ink)}
.title{flex:1;font-family:'Bangers',cursive;letter-spacing:.8px;font-size:23px;font-weight:400;line-height:1.1;word-break:break-word;color:var(--ink)}
.heart{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:#9b8bb0;font-size:19px;cursor:pointer;transition:.15s}
.heart.on{color:var(--red)}
.heart:active{transform:scale(1.35)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:50px;display:inline-flex;gap:5px;align-items:center;border:2px solid var(--ink);color:var(--ink)}
.t-cat{background:var(--yellow)}
.t-loc{background:#fff}
.t-mode{background:var(--teal)}
.slogan{font-style:italic;font-size:13.5px;font-weight:700;color:var(--magenta)}
.desc{font-size:14px;color:#3b2d52;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.more{font-size:13px;font-weight:800;color:var(--blue)}
.quick{display:flex;gap:8px;margin-top:auto;padding-top:12px;border-top:3px dotted var(--ink)}
.btn{flex:1;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;border-radius:12px;font-size:13px;font-weight:800;text-decoration:none;border:3px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:.1s}
.btn:hover{background:#ffe9b8}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.main{background:var(--orange);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.btn.main:hover{background:#ff8d3a}
mark{background:var(--yellow);color:inherit;border-radius:3px;padding:0 2px;box-shadow:0 0 0 1px var(--ink)}

.empty,.err{grid-column:1/-1;text-align:center;padding:44px 20px;border:4px solid var(--ink);border-radius:18px;background:var(--cream);color:#3b2d52;box-shadow:6px 6px 0 var(--ink)}
.empty h3,.err h3{color:var(--ink);margin:8px 0 4px;font-family:'Bangers',cursive;letter-spacing:1px;font-size:28px;font-weight:400}
.empty .btn,.err .btn{display:inline-flex;margin-top:14px;flex:none;padding:0 20px}
.err i{color:var(--red)}
.skel{height:190px;border-radius:18px;border:4px solid var(--ink);background:linear-gradient(100deg,#fff6dc 30%,#ffe3a0 50%,#fff6dc 70%);background-size:300% 100%;animation:sh 1.3s linear infinite;box-shadow:6px 6px 0 var(--ink)}
@keyframes sh{to{background-position:-300% 0}}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(26,16,51,.75);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-height:88vh;overflow-y:auto;background:var(--cream);border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.grab{width:50px;height:6px;border-radius:6px;background:var(--ink);margin:0 auto 14px}
.sheet .title{font-size:28px}
.sheet .desc{display:block;-webkit-line-clamp:unset;margin:12px 0;font-size:15px;white-space:pre-line}
.sheet .slogan{margin-top:12px;font-size:15px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.acts{display:flex;grid-template-columns:none;gap:8px;margin-top:12px}
.acts .btn{flex:none;min-height:32px;padding:3px 14px;font-size:13px;border-width:2px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.acts .full{grid-column:1/-1}
.close{position:absolute;right:12px;top:14px;width:40px;height:40px;border:3px solid var(--ink);border-radius:50%;background:var(--yellow);color:var(--ink);font-size:16px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.sheet .head{padding-right:48px}
.fb:hover{background:#1877f2;color:#fff}
.nd:hover{background:#00b246;color:#fff}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--yellow);border:3px solid var(--ink);box-shadow:var(--shadow);color:var(--ink);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}
.totop{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:50%;border:3px solid var(--ink);background:var(--magenta);color:#fff;font-size:18px;box-shadow:var(--shadow);cursor:pointer;opacity:0;pointer-events:none;transition:.25s;z-index:30}
.totop.show{opacity:1;pointer-events:auto}

@media(max-width:640px){
  .grid{grid-template-columns:1fr}
  .hero{padding-left:10px;padding-right:10px}
  .sheet{max-width:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-weight:800;font-size:14px}
.icon-btn .badge{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;padding:0 5px;border-radius:50px;background:var(--red);color:#fff;border:2px solid var(--ink);font-size:12px;line-height:18px;text-align:center;display:none}
.icon-btn .badge.show{display:block}
.panel{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.grp{width:100%}
.gl{font-family:'Bangers',cursive;letter-spacing:.8px;font-size:18px;margin:6px 0 6px;color:var(--purple)}
.chip .n{opacity:.65;font-weight:700;margin-left:4px}
.more-info{margin:14px 0 0;border-top:3px dotted var(--ink);padding-top:10px}
.more-info dt{font-weight:800;font-size:12px;color:var(--purple);margin-top:8px}
.more-info dd{font-size:14px;color:#3b2d52;white-space:pre-line;word-break:break-word}
@media(max-width:380px){.icon-btn .lbl{display:none}}

.search>svg{left:15px;top:50%;transform:translateY(-50%)}
.card{padding:0;animation:none;cursor:default}
.card:hover{transform:none;box-shadow:6px 6px 0 var(--ink)}
.card:active{transform:none;box-shadow:6px 6px 0 var(--ink)}
.bar{width:100%;min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 16px 12px 18px;background:none;border:0;text-align:left;cursor:pointer;color:inherit}
.bar:hover .title{color:var(--magenta)}
.bt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.chev{flex:none;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink);transition:transform .25s}
.card.open .chev{transform:rotate(180deg);background:var(--orange)}
.xp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.card.open .xp{grid-template-rows:1fr}
.xp>.inner{overflow:hidden;min-height:0}
.pad{padding:4px 18px 18px;border-top:3px dotted var(--ink);margin:0 0 0;display:flex;flex-direction:column;gap:14px}
.card .slogan{margin-top:12px}
.about{font-size:15px;color:#3b2d52;white-space:pre-line;word-break:break-word}
.sect{font-family:'Bangers',cursive;letter-spacing:.8px;font-size:19px;color:var(--purple);margin-bottom:4px}
.facts{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:6px 12px;font-size:14px}
.facts dt{font-weight:800;color:var(--purple);font-size:13px}
.facts dd{color:#3b2d52;word-break:break-word;white-space:pre-line}
.facts a{color:var(--blue);font-weight:700;text-decoration:underline}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .btn{flex:1;min-width:110px}
@media(max-width:380px){.facts{grid-template-columns:1fr;gap:0}.facts dd{margin-bottom:6px}}

.socials{display:flex;flex-wrap:wrap;gap:8px}
.soc{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border-radius:50px;border:3px solid var(--ink);color:#fff;font-weight:800;font-size:13px;text-decoration:none;box-shadow:2px 2px 0 var(--ink);transition:.1s}
.soc:active{transform:translate(2px,2px);box-shadow:none}
.soc.fb{background:#1877f2}
.soc.nd{background:#00a844}
.soc svg{flex:none}
#pills{padding-top:10px}

.links{display:flex;flex-direction:column;gap:6px}
.ln{display:flex;align-items:center;gap:12px;min-height:44px;text-decoration:none;font-weight:700;font-size:15px;color:var(--blue);word-break:break-word}
.ln>span:last-child{text-decoration:underline;text-underline-offset:3px}
.ln .ico{flex:none;width:38px;height:38px;border-radius:50%;border:3px solid var(--ink);background:var(--yellow);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:2px 2px 0 var(--ink)}
.ln:active .ico{transform:translate(2px,2px);box-shadow:none}
.ln.addr>span:last-child{white-space:pre-line}
div.ln.addr>span:last-child{text-decoration:none;color:var(--ink)}
.acts .btn{min-width:90px}
.bt .slogan{margin:0;font-size:14px;line-height:1.35}

.ln .ico.brand{background:#fff}
.ln.addr+.facts{margin-top:18px}
.ln .ico{flex:none;width:40px;height:40px;border:0;border-radius:0;background:none;padding:0;box-shadow:none;display:block;filter:drop-shadow(2px 2px 0 var(--ink))}
.ln .ico.brand{background:none;padding:0}
.ico>img,.ico>svg{display:block;width:40px;height:40px;border-radius:11px}
.ln:active .ico{transform:translate(2px,2px);filter:none}

.hero-img{width:100%;max-width:640px;margin:0 auto;height:clamp(105px,28vw,190px);object-fit:cover;object-position:50% 20%}
.hero{padding-bottom:4px}
.panel.open{display:block}
.panel{padding:10px 2px 0;max-height:60vh}
.panel .sel{width:100%;flex:none;margin-bottom:10px}
.acc{border:3px solid var(--ink);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
.acch{width:100%;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 12px;background:#fff;border:0;font-weight:800;font-size:14px;color:var(--ink);cursor:pointer;text-align:left}
.acch>span:first-child{flex:1}
.acch .selcnt{display:none;background:var(--magenta);color:#fff;border-radius:50px;font-size:12px;min-width:22px;height:22px;line-height:22px;text-align:center;padding:0 6px}
.acch .selcnt.on{display:inline-block}
.acch svg{flex:none;transition:transform .2s}
.acc.open .acch svg{transform:rotate(180deg)}
.accb{display:none;border-top:3px dotted var(--ink);padding:4px 12px 6px;max-height:220px;overflow-y:auto;background:var(--cream)}
.acc.open .accb{display:block}
.opt{display:flex;align-items:center;gap:10px;min-height:42px;font-size:14px;font-weight:700;cursor:pointer}
.opt input{width:20px;height:20px;accent-color:var(--magenta);flex:none}
.opt .oc{margin-left:auto;opacity:.6;font-size:12px}
.favopt{padding:2px 4px}
.applybar{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 8px;background:var(--cream);border-top:3px solid var(--ink);margin-top:6px}
.applybar .btn{flex:1}
.star{position:absolute;top:14px;right:14px;z-index:2;pointer-events:none;filter:drop-shadow(1px 1px 0 var(--ink))}

.hero-img{object-position:50% 14%}
/* ---- filter panel, comic style ---- */
.panel.open{background:#fff0cc;border:4px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);padding:12px 12px 0;margin:12px 2px 6px}
.ptitle{font-family:'Bangers',cursive;letter-spacing:1.2px;font-size:26px;line-height:1;color:var(--purple);text-shadow:2px 2px 0 var(--yellow);margin:0 0 10px}
.gl{font-family:'Bangers',cursive;letter-spacing:.8px;font-size:18px;color:var(--ink)}
.panel .sel{border-width:3px;border-radius:12px;height:46px;font-weight:800;box-shadow:3px 3px 0 var(--ink);background:#fff}
.acc{border:3px solid var(--ink);border-radius:14px;margin-bottom:10px;box-shadow:3px 3px 0 var(--ink);background:#fff}
.acch{font-family:'Bangers',cursive;letter-spacing:1px;font-size:20px;font-weight:400;min-height:50px;padding:0 14px;color:var(--ink)}
.acc.c0 .acch{background:var(--yellow)}
.acc.c1 .acch{background:var(--teal)}
.acc.c2 .acch{background:var(--orange);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.acc.c3 .acch{background:var(--magenta);color:#fff;text-shadow:1px 1px 0 var(--ink)}
.acch svg{width:30px;height:30px;padding:6px;border:3px solid var(--ink);border-radius:50%;background:#fff;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.acch .selcnt{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;background:var(--red);border:2px solid var(--ink);text-shadow:none}
.accb{background:#fffaf0;padding:6px 14px 8px}
.opt{border-bottom:2px dotted rgba(26,16,51,.25)}
.opt:last-child{border-bottom:0}
.opt input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:3px solid var(--ink);border-radius:7px;background:#fff;display:grid;place-content:center;margin:0;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.opt input:checked{background:var(--yellow)}
.opt input:checked::after{content:'';width:12px;height:7px;border-left:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.opt input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.favopt{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 12px;box-shadow:3px 3px 0 var(--ink);margin-bottom:10px}
.applybar{margin:0 -12px;padding:12px;background:linear-gradient(90deg,var(--purple),var(--magenta),var(--orange));border-top:4px solid var(--ink);border-radius:0 0 12px 12px}
.applybar .btn{min-height:48px;font-size:15px}
.applybar .btn.main{background:var(--yellow);color:var(--ink);text-shadow:none}
.applybar .btn.main:hover{background:#ffe27a}

/* hero border: light so dark trees in the corners do not blend in */

.opt{padding:0 4px;border-radius:8px;transition:background .15s}

.opt:has(input:checked){background:#fff3b0}
.opt input[type=radio]{border-radius:50%}
.opt input[type=radio]:checked::after{width:10px;height:10px;border:0;border-radius:50%;background:var(--ink);transform:none}
.favopt{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:3px 3px 0 var(--ink);margin-bottom:12px}
.favopt:hover,.favopt:has(input:checked){background:#fff3b0}

<script>
const CSV_URL='https://docs.google.com/spreadsheets/d/17vDXZS_tXVWAerdp0azT896Sg8cQYxCBN8zNl2d6Rec/gviz/tq?tqx=out:csv&gid=1342044865&headers=1';

/* Column headings to hide (exact match, any capitalization). Add more inside the brackets. */
const HIDE_COLUMNS=['email address'];
/* Hide any column whose heading contains one of these phrases. */
const HIDE_CONTAINS=['questions about your submission'];

/* RENAME FIELDS (app only - your sheet is never changed).
   Change the words on the RIGHT side. Leave the LEFT side alone. */
const LABELS={
  'About':'About',
  'Details':'Details',
  'Contact':'Contact',
  'Location':'Location',
  'Address':'Address',
  'City, State, Zip':'City, State, Zip',
  'Area Served':'Area Served',
  'Business type':'Business type',
  'Phone':'Phone',
  'Email':'Email',
  'Website':'Website',
  'Facebook':'Facebook',
  'Nextdoor':'Nextdoor',
  'Category':'Category',
  'Contact options':'Contact options'
};
function lbl(h){
  var k=(h||'').toString().trim().toLowerCase();
  for(var x in LABELS){if(x.trim().toLowerCase()===k)return LABELS[x]}
  return h;
}

var all=[], view=[], facetDefs=[];
var st={q:'',cat:'ALL',sort:'name-asc',fav:false,f:{},picked:false};
var pend={f:{},fav:false,sort:'name-asc',picked:false};
var accOpen={};
var favs={};
try{favs=JSON.parse(localStorage.getItem('ccdir-favs')||'{}')}catch(e){}
function saveFavs(){try{localStorage.setItem('ccdir-favs',JSON.stringify(favs))}catch(e){}}

const $=id=>document.getElementById(id);
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmtUrl(u){u=(u||'').toString().trim();return u.indexOf('http')===0?u:'https://'+u}
function telHref(p){var d=p.replace(/[^\d+]/g,'');return 'tel:'+(d.length===10?'+1'+d:d)}
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href^="tel:"]');
  if(!a||/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1))return;
  e.preventDefault();
  var num=a.textContent.trim();
  if(navigator.clipboard)navigator.clipboard.writeText(num).then(function(){toast('Number copied: '+num)},function(){toast(num)});else toast(num);
});
document.addEventListener('error',function(e){if(e.target&&e.target.classList&&e.target.classList.contains('blogo'))e.target.style.display='none'},true);
function keyOf(b){return b.name.toLowerCase().trim()}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),1800)}

/* ---------- data ---------- */
function isEmail(s){return !!s&&/^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)*\.[A-Za-z]{2,}$/.test(s.toString().trim())}
function isUrl(s){if(!s)return false;s=s.toLowerCase().trim();if(isEmail(s)||/\s/.test(s))return false;return s.indexOf('http')===0||s.indexOf('www.')===0||/^([a-z0-9\-]+\.)+[a-z]{2,}(\/\S*)?$/.test(s)}
function isPhone(s){if(!s)return false;return s.replace(/\D/g,'').length>=7&&!isEmail(s)}

/* private-looking columns are never shown, searched, or filtered */
function hdrSkip(k){k=k.trim().toLowerCase();if(HIDE_COLUMNS.indexOf(k)!==-1)return true;if(HIDE_CONTAINS.some(function(x){return k.indexOf(x)!==-1}))return true;return k===''||k==='timestamp'||k==='name'||k==='title'||k.indexOf('timestamp')!==-1||k.indexOf('personal')!==-1||k.indexOf('private')!==-1}

var MODES=['physical location','online only','mobile service'];
function modeLike(v){v=v.toLowerCase();return MODES.some(function(m){return v.indexOf(m)!==-1})}
function clean(v){
  v=(v==null?'':v).toString().trim();
  if(!v||v==='-')return '';
  if(/^(n\/a|na|none|null|no|nope)$/i.test(v))return '';
  return v;
}
function normUrl(u){return u.toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/\/+$/,'')}
function digits(v){return v.replace(/\D/g,'').slice(-10)}

/* decides what each sheet column is. Matching is by heading text only. */
function roleOf(h){
  var k=h.replace(/[\s\u00a0]+/g,' ').trim().toLowerCase();
  if(hdrSkip(k))return null;
  if(k==='business name'||k==='company name'||/^name of (your )?(business|company)/.test(k))return 'name';
  if(/public|display|publish/.test(k)&&/name/.test(k))return 'pubname';
  if(/public|display|publish/.test(k)&&/title|role|position/.test(k))return 'pubtitle';
  if(/^(contact|owner|business contact) (person|name)/.test(k))return 'pubname';
  if(/^(contact|owner|business contact) (title|role|position)/.test(k))return 'pubtitle';
  if(k.indexOf('category')===0)return 'category';
  if(/area\s*\/\s*city|city\s*served|area\s*served|service area|counties served|areas served/.test(k))return 'area';
  if(/address/.test(k)&&!/e-?mail|web|url|ip /.test(k))return 'address';
  if(/\bcity\b|\btown\b/.test(k))return 'city';
  if(/\bstate\b/.test(k))return 'state';
  if(/\bzip\b|postal/.test(k))return 'zip';
  if(k.indexOf('facebook')!==-1)return 'facebook';
  if(k.indexOf('nextdoor')!==-1)return 'nextdoor';
  if(/logo/.test(k))return 'logo';
  if(/phone|telephone|\bcell\b|contact number/.test(k))return 'phone';
  if(/website|web site|web address|web page|webpage|\burl\b/.test(k)||k==='domain')return 'website';
  if(/e-?mail/.test(k))return 'email';
  if(k.indexOf('about your business')!==-1)return 'about';
  if(/describe your|describe the business/.test(k))return 'describe';
  if(k.indexOf('please share')!==-1)return 'share';
  if(k.indexOf('slogan')!==-1||k.indexOf('additional info')!==-1)return 'slogan';
  return 'other';
}

var STATES={alabama:'AL',alaska:'AK',arizona:'AZ',arkansas:'AR',california:'CA',colorado:'CO',connecticut:'CT',delaware:'DE','district of columbia':'DC',florida:'FL',georgia:'GA',hawaii:'HI',idaho:'ID',illinois:'IL',indiana:'IN',iowa:'IA',kansas:'KS',kentucky:'KY',louisiana:'LA',maine:'ME',maryland:'MD',massachusetts:'MA',michigan:'MI',minnesota:'MN',mississippi:'MS',missouri:'MO',montana:'MT',nebraska:'NE',nevada:'NV','new hampshire':'NH','new jersey':'NJ','new mexico':'NM','new york':'NY','north carolina':'NC','north dakota':'ND',ohio:'OH',oklahoma:'OK',oregon:'OR',pennsylvania:'PA','puerto rico':'PR','rhode island':'RI','south carolina':'SC','south dakota':'SD',tennessee:'TN',texas:'TX',utah:'UT',vermont:'VT',virginia:'VA',washington:'WA','west virginia':'WV',wisconsin:'WI',wyoming:'WY'};
function fmtState(v){
  var t=v.toString().trim().replace(/\./g,'');
  if(/^[a-z]{2}$/i.test(t))return t.toUpperCase();
  return STATES[t.toLowerCase().replace(/\s+/g,' ')]||t;
}
var PH_RE=/(?:\+?1[\s.\-]*)?\(?\d{3}\)?[\s.\-]*\d{3}[\s.\-]*\d{4}/g;
function fmtOne(m,rest){
  var d=m.replace(/\D/g,'');
  if(d.length===11&&d.charAt(0)==='1')d=d.slice(1);
  var out=d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  var x=(rest||'').match(/(?:ext\.?|extension|x)\s*\.?\s*(\d+)/i);
  return x?out+' ext '+x[1]:out;
}
function phoneList(v){
  var t=v.toString().trim(),ms=t.match(PH_RE);
  if(!ms)return [];
  if(ms.length===1)return [fmtOne(ms[0],t.slice(t.indexOf(ms[0])+ms[0].length))];
  return ms.map(function(m){var p=t.indexOf(m);return fmtOne(m,t.slice(p+m.length).split(PH_RE)[0])});
}
function fmtPhone(v){var l=phoneList(v);return l.length?l.join(', '):v.toString().trim()}
function addPhones(rec,v){
  var l=phoneList(v);
  if(l.length){l.forEach(function(x){pushUniq(rec.phones,x,digits)});return true}
  return false;
}
function newRec(){return {logo:'',name:'',pubName:'',pubTitle:'',category:'',mode:'',about:[],aboutTop:[],phones:[],websites:[],emails:[],facebook:'',nextdoor:'',area:'',city:'',state:'',zip:'',address:[],slogan:'',extra:{}}}
function pushUniq(arr,v,keyfn){var k=keyfn?keyfn(v):v.toLowerCase();if(!arr.some(function(x){return (keyfn?keyfn(x):x.toLowerCase())===k}))arr.push(v)}

/* puts a value in the right bucket by what it looks like. returns true if placed */
function setLogo(r,v){
  if(r.logo)return true;
  var m=/(?:[?&]id=|\/d\/)([\w-]{15,})/.exec(v);
  if(m){r.logo='https://drive.google.com/thumbnail?id='+m[1]+'&sz=w300';return true}
  var u=(v.match(/https?:\/\/[^\s,]+/)||[''])[0];
  if(/\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(u)){r.logo=u;return true}
  return false;
}
function route(r,v){
  if(/drive\.google\.com\/(open\?id=|file\/d\/|uc\?)/i.test(v)){if(setLogo(r,v))return true}
  if(isEmail(v)&&!/\s/.test(v)){pushUniq(r.emails,v);return true}
  if(/facebook\.com|fb\.com|fb\.me/i.test(v)){if(!r.facebook)r.facebook=v;return true}
  if(/nextdoor\.com/i.test(v)){if(!r.nextdoor)r.nextdoor=v;return true}
  if(isUrl(v)&&!/\s/.test(v)){pushUniq(r.websites,v,normUrl);return true}
  if(isPhone(v)&&!/[a-z]{4,}/i.test(v)){if(addPhones(r,v))return true}
  return false;
}

var CATS=['Home & Garden Services','Local Trades & Repairs','Food & Drinks','Shops & Retail','Salons, Beauty & Fitness','Professional & Online Services'];
var CAT_OLD={neighborhoodfoodanddrinks:'Food & Drinks',mainstreetshopsandretail:'Shops & Retail'};
function catKey(x){return x.toString().toLowerCase().replace(/^\s*\d+[\.\)\-\s]*/,'').replace(/&/g,'and').replace(/[^a-z]/g,'')}
function canonCat(v){var k=catKey(v);if(CAT_OLD[k])return CAT_OLD[k];for(var i=0;i<CATS.length;i++){if(catKey(CATS[i])===k)return CATS[i]}return ''}
function catRank(c){var i=CATS.indexOf(c);return c==='Local Business'||!c?100:(i<0?50:i)}
function addrKey(x){return x.toString().toLowerCase().replace(/[^a-z0-9]/g,'')}
function addArea(rec,v){
  var cur=rec.area?rec.area.split(/\s*[,;]\s*/):[];
  v.toString().split(/\s*[,;]\s*/).forEach(function(x){x=x.trim();if(x&&!cur.some(function(c){return c.toLowerCase()===x.toLowerCase()}))cur.push(x)});
  rec.area=cur.join(', ');
}
function parseGrid(grid){
  var hi=-1;
  for(var r0=0;r0<Math.min(grid.length,6);r0++){
    if(grid[r0].some(function(c){return (c||'').toString().trim().toLowerCase()==='business name'})){hi=r0;break}
  }
  if(hi<0)hi=0;
  var heads=(grid[hi]||[]).map(function(c){return (c||'').toString().trim()});
  var roles=heads.map(roleOf);
  var map={},log=[];
  for(var r=hi+1;r<grid.length;r++){
    var row=grid[r],rec=newRec();
    for(var c=0;c<heads.length;c++){
      var role=roles[c];if(!role)continue;
      var v=clean(row[c]);if(!v)continue;
      var h=heads[c];
      switch(role){
        case 'name':if(!rec.name)rec.name=v;break;
        case 'category':var cc=canonCat(v);if(!rec.category&&cc)rec.category=cc;break;
        case 'logo':setLogo(rec,v);break;
        case 'area':addArea(rec,v);break;
        case 'pubname':if(!rec.pubName)rec.pubName=v;break;
        case 'pubtitle':if(!rec.pubTitle)rec.pubTitle=v;break;
        case 'city':if(!rec.city)rec.city=v;break;
        case 'state':if(!rec.state)rec.state=fmtState(v);break;
        case 'zip':if(!rec.zip)rec.zip=v;break;
        case 'address':pushUniq(rec.address,v,addrKey);break;
        case 'phone':if(!addPhones(rec,v)&&!route(rec,v)&&!rec.extra[h])rec.extra[h]=v;break;
        case 'about':case 'describe':case 'share':
          if(modeLike(v)&&v.length<100){if(!rec.mode)rec.mode=v;break}
          if(role==='describe'){var dv=v.slice(0,400).trim();if(dv)pushUniq(rec.aboutTop,dv)}else pushUniq(rec.about,v);break;
        case 'slogan':if(!route(rec,v)&&!rec.slogan)rec.slogan=v;break;
        case 'facebook':if(/facebook|fb\./i.test(v)||isUrl(v)){if(!rec.facebook)rec.facebook=v}else if(!route(rec,v))rec.extra[h]=v;break;
        case 'nextdoor':if(/nextdoor/i.test(v)||isUrl(v)){if(!rec.nextdoor)rec.nextdoor=v}else if(!route(rec,v))rec.extra[h]=v;break;
        default:
          if(!route(rec,v)&&!rec.extra[h])rec.extra[h]=v;
      }
    }
    var n=rec.name;
    var hint=row.filter(function(x){return clean(x)}).slice(0,3).join(' | ');
    if(!n||n.length<2||n.toLowerCase()==='test'||n.toLowerCase()==='none'||n.toLowerCase().indexOf('business name')!==-1){
      log.push('Row '+(r+1)+': SKIPPED - '+(!n?'no Business Name found':'name looks like test/none')+(hint?' ('+hint+')':''));
      continue;
    }
    var key=n.toLowerCase();
    if(!map[key]){map[key]=rec;log.push('Row '+(r+1)+': kept - '+n)}
    else{
      log.push('Row '+(r+1)+': NEWER row replaces an earlier row with the same name - '+n);
      map[key]=rec;
    }
  }
  var out=Object.keys(map).map(function(k){
    var r=map[k];
    r.category=r.category||'Local Business';
    r.contact=[r.pubName,r.pubTitle].filter(Boolean).join(', ');
    if(r.about.length){var ex2={'About your business':r.about.join('\n\n')};Object.keys(r.extra).forEach(function(h){ex2[h]=r.extra[h]});r.extra=ex2;r.about=[]}
    r.description=r.aboutTop.concat(r.about).join('\n\n');
    r.phone=r.phones[0]||'';r.website=r.websites[0]||'';r.email=r.emails[0]||'';
    r.location=r.area||r.city||'';
    r.addressLine=r.address.join('\n');
    var sz=[r.state,r.zip].filter(Boolean).join(' ');
    r.cityStateZip=[r.city,sz].filter(Boolean).join(', ');
    return r;
  });
  return {list:out,heads:heads,roles:roles,log:log,rows:Math.max(0,grid.length-hi-1)};
}

function load(){
  Papa.parse(CSV_URL+'&t='+Date.now(),{
    download:true,header:false,skipEmptyLines:true,
    complete:function(res){
      var out=parseGrid(res.data||[]);
      all=out.list;
      if(/[?&]debug/.test(location.search)){
        var d=$('dbg');d.style.display='block';
        d.innerHTML='<b>Rows read:</b> '+out.rows+' &nbsp; <b>Businesses kept:</b> '+all.length+'<br><b>Columns (heading &rarr; how the app uses it):</b><br>'+out.heads.map(function(h,i){return (i+1)+'. '+esc(h||'(blank)')+' &rarr; '+(out.roles[i]||'hidden')}).join('<br>')+'<br><br><b>Each row:</b><br>'+out.log.map(esc).join('<br>');
      }
      computeFacets();
      buildFilters();
      apply();
    },
    error:function(){
      if(!all.length)$('grid').innerHTML='<div class="err"><h3>Could not load the directory</h3><p>Check your connection. Make sure the Google Sheet is shared as "Anyone with the link".</p><button class="btn" onclick="load()">Try again</button></div>';
    }
  });
}

/* ---------- facets: every useful column becomes a filter ---------- */
function computeFacets(){
  facetDefs=[];
  all.forEach(b=>b.fx={});
  function add(label,getter){
    var cnt={},nonEmpty=0;
    all.forEach(b=>{var v=getter(b).map(x=>(x||'').trim()).filter(Boolean);b.fx[label]=v;if(v.length)nonEmpty++;v.forEach(x=>cnt[x]=(cnt[x]||0)+1)});
    var keys=Object.keys(cnt);
    var repeats=keys.some(k=>cnt[k]>=2);
    if(keys.length>=2&&keys.length<=30&&repeats)facetDefs.push({label:label,values:keys.sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b)),counts:cnt});
    else all.forEach(b=>delete b.fx[label]);
  }
  (function(){
    var cnt={};
    all.forEach(function(b){var v=(b.category&&b.category!=='Local Business')?[b.category]:[];b.fx['Category']=v;v.forEach(function(x){cnt[x]=(cnt[x]||0)+1})});
    CATS.forEach(function(c){cnt[c]=cnt[c]||0});
    var extra=Object.keys(cnt).filter(function(k){return CATS.indexOf(k)<0}).sort();
    facetDefs.push({label:'Category',values:CATS.concat(extra),counts:cnt});
  })();
  add('Area Served',b=>b.location?b.location.split(/\s*[,;]\s*/):[]);
  add('Contact options',b=>{var a=[];if(b.phone)a.push('Has phone');if(b.email)a.push('Has email');if(b.website)a.push('Has website');if(b.facebook)a.push('Has Facebook');if(b.nextdoor)a.push('Has Nextdoor');return a});
  var hs={};all.forEach(b=>Object.keys(b.extra).forEach(h=>hs[h]=1));
  Object.keys(hs).forEach(h=>add(h,b=>{var v=b.extra[h];if(!v||v.length>60)return [];return v.split(/\s*[,;]\s*/)}));
  /* drop saved selections that no longer exist */
  [st.f,pend.f].forEach(function(F){Object.keys(F).forEach(l=>{var d=facetDefs.find(x=>x.label===l);if(!d)delete F[l];else F[l]=F[l].filter(v=>d.values.indexOf(v)!==-1)})});
}

var CHEV='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg>';
function facetRank(l){var i=['Category','Contact options','Area Served'].indexOf(l);return i===-1?9:i}
function buildFilters(){
  $('pills').innerHTML='<button class="pill active" id="allBtn" type="button">All <span class="n">'+all.length+'</span></button>';
  var sc=$('panel').scrollTop;
  var p='<div class="ptitle">Narrow it down!</div>';
  var order=facetDefs.map(function(d,i){return {d:d,i:i}}).sort(function(a,b){return facetRank(a.d.label)-facetRank(b.d.label)||a.i-b.i});
  order.forEach(function(o){
    var d=o.d,fi=o.i,sel=pend.f[d.label]||[],open=!!accOpen[d.label];
    p+='<div class="acc c'+(order.indexOf(o)%3)+(open?' open':'')+'" data-l="'+esc(d.label)+'"><button type="button" class="acch" aria-expanded="'+open+'"><span>'+esc(lbl(d.label))+'</span><span class="selcnt'+(sel.length?' on':'')+'">'+sel.length+'</span>'+CHEV+'</button><div class="accb">'
      +d.values.map(function(v,vi){return '<label class="opt"><input type="checkbox" data-fi="'+fi+'" data-vi="'+vi+'"'+(sel.indexOf(v)!==-1?' checked':'')+'><span>'+esc(v)+'</span><span class="oc">'+d.counts[v]+'</span></label>'}).join('')+'</div></div>';
  });
  var nsv=all.filter(function(b){return favs[keyOf(b)]}).length;
  p+='<label class="savedrow"><input type="checkbox" id="favOnly"'+(pend.fav?' checked':'')+'><span class="svl">Saved</span><span class="svc">'+nsv+'</span></label>';
  p+='<div class="applybar"><button class="btn" type="button" id="reset">Reset all</button><button class="btn main" type="button" id="applyBtn">Apply filters</button></div>';
  $('panel').innerHTML=p;
  $('panel').scrollTop=sc;
}

function syncPend(){pend={f:JSON.parse(JSON.stringify(st.f)),fav:st.fav,sort:st.sort,picked:st.picked}}
function closePanel(){var pn=$('panel');pn.classList.remove('open');var fb=$('filterBtn');fb.classList.remove('on');fb.setAttribute('aria-expanded','false')}
function commitPend(){
  st.f={};Object.keys(pend.f).forEach(function(l){if(pend.f[l]&&pend.f[l].length)st.f[l]=pend.f[l].slice()});
  st.fav=pend.fav;
  apply();closePanel();
}

function catCmp(a,b){
  var x=catRank(a.category),y=catRank(b.category);
  if(x!==y)return x-y;
  if(x===50)return a.category.localeCompare(b.category,undefined,{sensitivity:'base'})||a.name.localeCompare(b.name);
  return a.name.localeCompare(b.name);
}
function apply(){
  var terms=st.q.toLowerCase().trim().split(/\s+/).filter(Boolean);
  view=all.filter(b=>{
    if(terms.length){
      var hay=[b.name,b.category,b.description,b.location,b.slogan,b.mode,b.addressLine,b.cityStateZip,b.city,b.state,b.zip,b.area,b.phones.join(' '),b.phones.join(' ').replace(/\D/g,''),b.emails.join(' '),b.websites.join(' '),b.facebook,b.nextdoor].concat(Object.keys(b.extra).map(function(h){return b.extra[h]})).join(' ').toLowerCase();
      if(terms.some(t=>hay.indexOf(t)===-1))return false;
    }
    if(st.cat!=='ALL'&&b.category!==st.cat)return false;
    for(var l in st.f){var sel=st.f[l];if(sel&&sel.length&&!(b.fx[l]||[]).some(v=>sel.indexOf(v)!==-1))return false}
    if(st.fav&&!favs[keyOf(b)])return false;
    return true;
  });
  var s=st.sort;
  view.sort((a,b)=>s==='name-desc'?b.name.localeCompare(a.name):s==='cat-asc'?catCmp(a,b):s==='loc-asc'?a.location.localeCompare(b.location)||a.name.localeCompare(b.name):a.name.localeCompare(b.name));
  render();
  var n=st.fav?1:0;for(var l in st.f)n+=(st.f[l]||[]).length;
  var bd=$('badge');bd.textContent=n;bd.classList.toggle('show',n>0);
  $('count').innerHTML='<b>'+view.length+'</b> of '+all.length+' businesses';
  $('clear').classList.toggle('show',!!st.q);
  var ab=$('allBtn');if(ab)ab.classList.toggle('active',!st.q.trim()&&!st.fav&&n===0);
}

function hl(text){
  var t=esc(text);
  if(!st.q.trim())return t;
  st.q.trim().split(/\s+/).forEach(w=>{
    var r=new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?![^<]*>)','gi');
    t=t.replace(r,'<mark>$1</mark>');
  });
  return t;
}

function mapUrl(b){
  if(!b.addressLine&&!b.cityStateZip)return '';
  var q=(b.addressLine?b.addressLine.replace(/\n/g,', '):b.name)+(b.cityStateZip?', '+b.cityStateZip:'');
  return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
}
function linkText(u){return u.toString().replace(/^https?:\/\//i,'').replace(/^www\./i,'').replace(/\/$/,'')}

function fmtVal(h,v){
  var t=v.toString().trim();
  if(!/\s/.test(t)&&isEmail(t))return '<a href="mailto:'+esc(t)+'">'+esc(t)+'</a>';
  if(!/\s/.test(t)&&isUrl(t))return '<a href="'+esc(fmtUrl(t))+'" target="_blank" rel="noopener">'+esc(linkText(t))+'</a>';
  if(/phone|tel|mobile|cell|fax/i.test(h)&&isPhone(t))return '<a href="'+telHref(t)+'">'+esc(fmtPhone(t))+'</a>';
  return esc(t);
}
function rankHdr(h){
  h=h.toLowerCase();
  if(/street|address|suite|unit/.test(h))return 0;
  if(/city|state|zip|postal|county|area|region/.test(h))return 1;
  if(/hour|open|day|schedule/.test(h))return 3;
  return 4;
}
function orderedExtras(b){

}

function pdfWrap(t,max){
  var out=[];

    var line='';

      while(w.length>max){if(line){out.push(line);line=''}out.push(w.slice(0,max));w=w.slice(max)}

      while(ctx.measureText(w).width>maxW){var k=w.length;while(k>1&&ctx.measureText(w.slice(0,k)).width>maxW)k--;if(line){out.push(line);line=''}out.push(w.slice(0,k));w=w.slice(k)}

}

        [[left,M],[right,COL2]].forEach(function(cp){
          var yy=y;
          cp[0].forEach(function(f){
            cvSet(c,'600 7.5px '+BF_B,'0.9px');c.fillStyle=BC.gray;c.fillText(f.label,cp[1],yy+8);
            f.lines.forEach(function(ln,i){
              cvSet(c,'400 9.5px '+BF_B,'0px');
              var ty=yy+12+i*13,w=c.measureText(ln.t).width;
              c.fillStyle=ln.u?BC.link:BC.text;c.fillText(ln.t,cp[1],ty+9);
              if(ln.u){c.fillRect(cp[1],ty+10.5,w,0.6);reg({x:cp[1],y:ty,w:w,h:12,u:ln.u})}
            });
            yy+=f.h;
          });
        });
      }});
    }

    /* about + details */
    function label(t){L.push({h:14,keep:true,draw:function(c,y){cvSet(c,'600 7.5px '+BF_B,'0.9px');c.fillStyle=BC.gray;c.fillText(t,M,y+10)}})}
    function para(text,font,col,lh){
      cvSet(mc,font,'0px');
      cvWrap(mc,text,CW).forEach(function(t){L.push({h:lh,draw:function(c,y){cvSet(c,font,'0px');c.fillStyle=col;c.fillText(t,M,y+lh-4)}})});
    }
    if(b.aboutTop[0]||b.about.length){
      label('ABOUT');
      if(b.aboutTop[0])para(b.aboutTop[0],'700 9.5px '+BF_B,BC.ink,13.5);
      var rest=b.aboutTop.slice(1).concat(b.about).join('\n\n');
      if(rest)para(rest,'400 9.5px '+BF_B,BC.text,13.5);
      L.push({h:5,draw:function(){}});
    }
    Object.keys(b.extra).forEach(function(h2){
      var v=b.extra[h2].toString().trim(),u='';
      if(!/\s/.test(v)){if(isEmail(v))u='mailto:'+v;else if(isUrl(v))u=fmtUrl(v)}
      label(lbl(h2).replace(/:\s*$/,'').toUpperCase());
      cvSet(mc,'400 9.5px '+BF_B,'0px');
      cvWrap(mc,v,CW).forEach(function(t){L.push({h:13.5,draw:function(c,y,reg){
        cvSet(c,'400 9.5px '+BF_B,'0px');c.fillStyle=u?BC.link:BC.text;c.fillText(t,M,y+9.5);
        if(u){var w=c.measureText(t).width;c.fillRect(M,y+11,w,0.6);reg({x:M,y:y,w:w,h:12,u:u})}
      }})});
    });
    L.push({h:10,draw:function(){}});
    return L;
  }

  /* ----- plan the pages ----- */
  var headH=126,runH=62;
  var plan=[{y:headH,items:[]}],py=headH;
  list.forEach(function(b){
    var its=items(b);
    its.forEach(function(it,k){
      var need=it.h+(it.keep&&its[k+1]?its[k+1].h:0);
      if(it.rule&&its[k+1]){need=it.h+its[k+1].h+its[k+2].h}
      if(py+need>LIM&&plan[plan.length-1].items.length){plan.push({y:runH,items:[]});py=runH}
      plan[plan.length-1].items.push({y:py,it:it});py+=it.h;
    });
  });

  /* ----- draw ----- */
  var out=[];
  for(var pi=0;pi<plan.length;pi++){
    var cv=document.createElement('canvas');cv.width=PW*S;cv.height=PH*S;
    var c=cv.getContext('2d');c.scale(S,S);c.textBaseline='alphabetic';
    c.fillStyle='#fff';c.fillRect(0,0,PW,PH);
    var links=[],reg=function(o){links.push(o)};
    if(pi===0){
      cvSet(c,'400 10px '+BF_H,'3px');c.fillStyle=BC.orange;c.fillText('CHARLOTTE COUNTY',M,56);
      cvSet(c,'600 32px '+BF_H,'0.5px');c.fillStyle=BC.purple;c.fillText('Small Business Directory',M,90);
      c.fillStyle=BC.orange;c.fillRect(M,100,44,3);
      cvSet(c,'400 9px '+BF_B,'0px');c.fillStyle=BC.gray;
      c.fillText(list.length+' business'+(list.length===1?'':'es')+'   |   '+today,M,120);
    }else{
      cvSet(c,'500 9px '+BF_H,'2px');c.fillStyle=BC.gray;c.fillText('SMALL BUSINESS DIRECTORY',M,40);
      c.fillStyle=BC.rule;c.fillRect(M,48,CW,0.8);
    }
    plan[pi].items.forEach(function(e){
      if(e.it.rule&&!(pi===0&&e===plan[0].items[0])){c.fillStyle=BC.rule;c.fillRect(M,e.y+2,CW,0.8)}
      e.it.draw(c,e.y,reg);
    });
    c.fillStyle=BC.rule;c.fillRect(M,FOOT,CW,0.8);
    cvSet(c,'400 8px '+BF_B,'0px');c.fillStyle=BC.gray;
    c.fillText('Charlotte County Small Business Directory',M,FOOT+14);
    var pg='Page '+(pi+1)+' of '+plan.length,pw=c.measureText(pg).width;
    c.fillText(pg,M+CW-pw,FOOT+14);
    var data=cv.toDataURL('image/jpeg',0.9);
    out.push({bin:atob(data.split(',')[1]),w:cv.width,h:cv.height,links:links});
    cv.width=1;cv.height=1;
  }
  /* ----- pack into a PDF ----- */
  var objs=[null];
  function add(o){objs.push(o);return objs.length-1}
  add('');add('');
  var pn=[];
  out.forEach(function(p){
    var im=add('<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.bin.length+' >>\nstream\n'+p.bin+'\nendstream');
    var stream='q '+PW+' 0 0 '+PH+' 0 0 cm /Im0 Do Q';
    var cn=add('<< /Length '+stream.length+' >>\nstream\n'+stream+'\nendstream');
    var an=p.links.map(function(l){
      var u=l.u.replace(/[^\x21-\x7e]/g,'').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
      return add('<< /Type /Annot /Subtype /Link /Rect ['+l.x.toFixed(1)+' '+(PH-l.y-l.h).toFixed(1)+' '+(l.x+l.w).toFixed(1)+' '+(PH-l.y).toFixed(1)+'] /Border [0 0 0] /A << /S /URI /URI ('+u+') >> >>');
    });
    pn.push(add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+cn+' 0 R'+(an.length?' /Annots ['+an.map(function(n){return n+' 0 R'}).join(' ')+']':'')+' >>'));
  });
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids ['+pn.map(function(n){return n+' 0 R'}).join(' ')+'] /Count '+pn.length+' >>';
  var pdf='%PDF-1.4\n',offs=[];
  for(var n=1;n<objs.length;n++){offs[n]=pdf.length;pdf+=n+' 0 obj\n'+objs[n]+'\nendobj\n'}
  var xr=pdf.length;
  pdf+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(var m=1;m<objs.length;m++)pdf+=('0000000000'+offs[m]).slice(-10)+' 00000 n \n';
  pdf+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
  var u8=new Uint8Array(pdf.length);
  for(var q=0;q<pdf.length;q++)u8[q]=pdf.charCodeAt(q)&255;
  return new Blob([u8],{type:'application/pdf'});
}
function doPdf(list,fname){
  toast('Building PDF...');
  buildPdfCanvas(list).then(function(blob){saveBlob(blob,fname||'charlotte-county-business-directory.pdf');toast('Downloaded')}).catch(function(e){console.error(e);toast('Could not build the PDF')});
}
var pendingAct='';
function runAct(list){
  $('chooser').classList.remove('show');
  if(!list.length){toast('Nothing to '+(pendingAct==='print'?'print':'download'));return}
  if(pendingAct==='print')doPrint(list);else if(pendingAct==='csv')doXlsx(list);else doPdf(list);
}
function askAct(kind){
  pendingAct=kind;
  if(!all.length)return;
  if(view.length===all.length){runAct(view);return}
  $('chT').textContent={print:'Print',csv:'Download Spreadsheet',pdf:'Download PDF'}[kind];
  $('chRes').textContent='Current results ('+view.length+')';
  $('chRes').disabled=!view.length;
  $('chAll').textContent='All businesses ('+all.length+')';
  $('chooser').classList.add('show');
}
$('printBtn').onclick=function(){askAct('print')};
$('dlBtn').onclick=function(){$('fmtBox').classList.add('show')};
$('fmtCsv').onclick=function(){$('fmtBox').classList.remove('show');askAct('csv')};
$('fmtPdf').onclick=function(){$('fmtBox').classList.remove('show');askAct('pdf')};
$('fmtX').onclick=function(){$('fmtBox').classList.remove('show')};
$('fmtBox').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
$('chRes').onclick=function(){runAct(view)};
$('chAll').onclick=function(){runAct(sortedAll())};
$('chX').onclick=function(){$('chooser').classList.remove('show')};
$('chooser').addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
window.addEventListener('afterprint',function(){$('printArea').innerHTML=''});

/* ---------- share options ---------- */
var shareB=null;
function contactText(b){
  var L=[b.name];
  if(b.contact)L.push('Contact: '+b.contact);
  if(b.slogan)L.push('"'+b.slogan+'"');
  b.phones.forEach(function(x){L.push('Phone: '+x)});
  b.websites.forEach(function(x){L.push('Website: '+fmtUrl(x))});
  b.emails.forEach(function(x){L.push('Email: '+x)});
  if(b.facebook)L.push('Facebook: '+fmtUrl(b.facebook));
  if(b.nextdoor)L.push('Nextdoor: '+fmtUrl(b.nextdoor));
  var addr=[b.addressLine,b.cityStateZip].filter(Boolean).join(', ').replace(/\n/g,', ');
  if(addr)L.push('Address: '+addr);
  if(b.area&&!/online only/i.test(b.mode||''))L.push('Area Served: '+b.area);
  return L.join('\n');
}
function vEsc(x){return (x||'').toString().replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function vcard(b){
  var v=['BEGIN:VCARD','VERSION:3.0','FN:'+vEsc(b.name),'ORG:'+vEsc(b.name)];
  b.phones.forEach(function(x){v.push('TEL;TYPE=WORK,VOICE:'+x.replace(/\s*ext.*$/i,''))});
  b.emails.forEach(function(x){v.push('EMAIL;TYPE=WORK:'+x)});
  b.websites.forEach(function(x){v.push('URL:'+fmtUrl(x))});
  if(b.facebook)v.push('URL:'+fmtUrl(b.facebook));
  if(b.nextdoor)v.push('URL:'+fmtUrl(b.nextdoor));
  if(b.addressLine||b.city||b.state||b.zip)v.push('ADR;TYPE=WORK:;;'+vEsc((b.addressLine||'').replace(/\n/g,', '))+';'+vEsc(b.city)+';'+vEsc(b.state)+';'+vEsc(b.zip)+';');
  var note=[b.contact?'Contact: '+b.contact:'',b.slogan,b.area&&!/online only/i.test(b.mode||'')?'Area Served: '+b.area:''].filter(Boolean).join(' - ');
  if(note)v.push('NOTE:'+vEsc(note));
  v.push('END:VCARD');
  return v.join('\r\n');
}
function openShare(b){
  shareB=b;
  $('shT').textContent=b.name;
  $('shText').style.display=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)?'':'none';
  $('shareBox').classList.add('show');
}
function closeShare(){$('shareBox').classList.remove('show')}
$('shEmail').onclick=function(){var b=shareB;closeShare();if(b)location.href='mailto:?subject='+encodeURIComponent(b.name)+'&body='+encodeURIComponent(contactText(b))};
$('shText').onclick=function(){
  var b=shareB;closeShare();if(!b)return;
  var t=contactText(b),ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
  var a=document.createElement('a');a.href='sms:'+(ios?'&':'?')+'body='+encodeURIComponent(t);
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){
    if(!document.hidden){
      if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast('No text app opened. Details copied - paste into a message.')},function(){toast('No text app opened on this device')});
      else toast('No text app opened on this device');
    }
  },1500);
};
$('shCard').onclick=function(){
  var b=shareB;closeShare();if(!b)return;
  var blob=new Blob([vcard(b)],{type:'text/vcard;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(b.name.replace(/[^\w\- ]+/g,'').trim()||'contact')+'.vcf';
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
};
$('shPdf').onclick=function(){var b=shareB;closeShare();if(b)doPdf([b],(b.name.replace(/[^\w\- ]+/g,'').trim()||'business')+'.pdf')};
$('shX').onclick=closeShare;
$('shareBox').addEventListener('click',function(e){if(e.target===this)closeShare()});

load();
setInterval(load,60000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
