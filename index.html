<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charlotte County Business Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://googleapis.com" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #f59e0b;
      --primary-dark: #d97706;
      --primary-glow: rgba(245, 158, 11, 0.3);
      --accent-dark: #78350f;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #fef3c7 0%, #f8fafc 60%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 32px 16px;
    }
    .app-container { max-width: 1040px; margin: 0 auto; }
    .hero-banner {
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 50%, #b45309 100%);
      color: #ffffff;
      padding: 42px 28px;
      border-radius: 28px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 40px -10px rgba(217, 119, 6, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.25);
      margin-bottom: 28px;
    }
    .badge-hero {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(120, 53, 15, 0.85);
      backdrop-filter: blur(8px);
      color: #fef3c7;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 50px;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .hero-banner h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.15);
    }
    .hero-banner p { font-size: 16px; opacity: 0.95; max-width: 620px; margin: 0 auto; line-height: 1.5; }
    .search-wrapper { position: relative; margin-bottom: 20px; }
    .search-icon { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--primary-dark); font-size: 18px; }
    .search-input {
      width: 100%;
      padding: 18px 20px 18px 52px;
      font-size: 16px;
      font-weight: 500;
      border: 2px solid var(--border);
      border-radius: 20px;
      background: #ffffff;
      color: var(--text-main);
      outline: none;
      box-shadow: 0 8px 20px rgba(0,0,0,0.03);
      transition: all 0.3s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 5px var(--primary-glow), 0 12px 25px rgba(217, 119, 6, 0.15);
      transform: translateY(-2px);
    }
    .directory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 22px; }
    .biz-card {
      background: var(--card-bg);
      border-radius: 22px;
      border: 1px solid rgba(226, 232, 240, 0.9);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .biz-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #f59e0b, #d97706);
    }
    .biz-card:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: 0 20px 35px -10px rgba(217, 119, 6, 0.22), 0 0 18px var(--primary-glow);
    }
    .card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
    .avatar-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #fef3c7, #fde68a);
      color: #b45309;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 20px; font-weight: 800;
    }
    .biz-title { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; color: var(--text-main); }
    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag { font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 50px; text-transform: uppercase; }
    .tag-cat { background: #fef3c7; color: #b45309; }
    .tag-loc { background: #f1f5f9; color: #475569; }
    .biz-slogan { font-style: italic; font-size: 13px; color: var(--primary-dark); margin-bottom: 10px; font-weight: 600; }
    .biz-desc { font-size: 14px; color: var(--text-muted); line-height: 1.55; margin-bottom: 18px; }
    .card-actions { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px dashed var(--border); }
    .btn-action { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; text-decoration: none; }
    .btn-phone { background: #f8fafc; color: #334155; border: 1px solid var(--border); }
    .btn-email { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .btn-web { background: linear-gradient(135deg, #f59e0b, #d97706); color: #ffffff; }
    #loading-spinner { text-align: center; padding: 60px 20px; font-family: 'Outfit', sans-serif; font-size: 20px; color: var(--primary-dark); }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 50px 20px; background: #ffffff; border-radius: 20px; border: 2px dashed var(--border); color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="hero-banner">
      <div class="badge-hero"><i class="fa-solid fa-bolt"></i> Booming Businesses</div>
      <h1>Charlotte County Directory</h1>
      <p>Explore, search, and support local trailblazers across Charlotte County!</p>
    </div>
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="Search businesses..." onkeyup="filterDirectory()">
    </div>
    <div id="loading-spinner"><i class="fa-solid fa-circle-notch fa-spin"></i> Loading Directory...</div>
    <div id="directoryGrid" class="directory-grid"></div>
  <  <script>
    // Live database endpoint tracking your newly generated form spreadsheet data rows
    const CSV_URL = 'https://google.com';
    var allBusinesses = [];

    // Helper utility to parse spreadsheet fields safely without mixing up string comma blocks
    function parseCSV(text) {
      let lines = text.split('\n');
      return lines.map(line => {
        let result = []; let current = ''; let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          let char = line[i];
          if (char === '"') { inQuotes = !inQuotes; }
          else if (char === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
          else { current += char; }
        }
        result.push(current.trim());
        return result;
      });
    }

    // Fetches live data feed, maps specific column index elements, and sanitizes variables
    async function loadDirectoryData() {
      try {
        const res = await fetch(CSV_URL);
        const text = await res.text();
        const rows = parseCSV(text).slice(1);

        allBusinesses = rows.filter(row => row && row[4]).map(row => {
          let type = row[5];
          let cleanLoc = 'Online Only';
          if (type === 'Physical Location') { 
            cleanLoc = `${row[11] || ''} ${row[12] || ''}, ${row[13] || ''} ${row[14] || ''}`.trim(); 
          } else if (row[17]) { 
            cleanLoc = `Serves: ${row[17]}`; 
          }

          return {
            name: row[4] || 'Local Business',
            category: row[6] || 'General',
            description: row[7] || '',
            location: cleanLoc,
            phone: row[8] || row[15] || '',
            website: row[9] || row[16] || '',
            email: row[10] || '',
            slogan: row[21] || ''
          };
        });

        document.getElementById('loading-spinner').style.display = 'none';
        renderDirectory(allBusinesses);
      } catch (err) {
        document.getElementById('loading-spinner').innerText = 'Failed to establish database connection.';
      }
    }

    // Builds cards and writes them cleanly into view
    function renderDirectory(list) {
      var grid = document.getElementById('directoryGrid');
      grid.innerHTML = '';
      if (list.length === 0) {
        grid.innerHTML = '<div class="empty-state"><h3>No business listings match your query.</h3></div>';
        return;
      }
      list.forEach(function(b) {
        var initial = (b.name || 'L').charAt(0).toUpperCase();
        var html = `<div class="biz-card"><div>
          <div class="card-header"><div class="avatar-icon">${initial}</div><div><div class="biz-title">${b.name}</div></div></div>
          <div class="tag-container">
            <span class="tag tag-cat"><i class="fa-solid fa-tag"></i> ${b.category}</span>
            <span class="tag tag-loc"><i class="fa-solid fa-location-dot"></i> ${b.location}</span>
          </div>
          ${b.slogan ? `<div class="biz-slogan">"\${b.slogan}"</div>` : ''}
          <div class="biz-desc">${b.description}</div>
        </div><div class="card-actions">`;
        
        if (b.phone) html += `<a href="tel:${b.phone}" class="btn-action btn-phone"><i class="fa-solid fa-phone"></i> ${b.phone}</a>`;
        if (b.email) html += `<a href="mailto:${b.email}" class="btn-action btn-email"><i class="fa-solid fa-envelope"></i> Email</a>`;
        if (b.website) html += `<a href="${b.website.startsWith('http') ? b.website : 'https://'+b.website}" target="_blank" class="btn-action btn-web"><i class="fa-solid fa-globe"></i> Website</a>`;
        
        html += '</div></div>';
        grid.innerHTML += html;
      });
    }

    // Live search query matching engine
    function filterDirectory() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var filtered = allBusinesses.filter(b => 
        b.name.toLowerCase().includes(q) || b.category.toLowerCase().includes(q) || b.description.toLowerCase().includes(q) || b.location.toLowerCase().includes(q)
      );
      renderDirectory(filtered);
    }

    loadDirectoryData();
  </script>
</body>
</html>
/div>
